name: CI
run-name: pytest-CI
on:
  push:
    branches: 
      - main
      - CI
  pull_request:
    branches: [ main ]
jobs:
  test-py312:
    runs-on: ubuntu-24.04
    steps:
      # get specific commit
      - uses: actions/checkout@v7
      # get apptainer
      - uses: eWaterCycle/setup-apptainer@v3
        with:
          apptainer-version: 1.5.4
      # get micromamba and install several software dependencies
      - uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: '2.10.0-0'
          environment-name: test-env
          generate-run-shell: true
          create-args: >-
            python=3.12
            pip
            ndcctools==7.16.5
            plumed
            simple-dftd3
            dftd3-python
            -c conda-forge
          init-shell: bash
          cache-environment: true
          post-cleanup: all
      # install remaining dependencies and psiflow
      - name: Install pip dependencies
        shell: micromamba-shell {0}
        run: |
          which pip
          pip install --no-cache-dir \
          torch==2.15.0 --index-url https://download.pytorch.org/whl/cu132 \
          https://github.com/acesuit/mace.git@v0.3.17 \
          https://github.com/i-pi/i-pi.git@v3.3.1 \
          plumed

          pip install .[dev]
      # cache container images
      - uses: actions/cache@v4
        with:
          path: ~/.apptainer/cache
          key: apptainer-containers-v1
      # download container images (unless cached)
      - env:
          APPTAINER_CACHEDIR: ~/.apptainer/cache
        run: |
          apptainer pull --force docker://cp2k/cp2k:2025.2_mpich_x86_64_psmp
          apptainer pull --force oras://ghcr.io/molmod/gpaw:24.1
      - name: Run test suite
        shell: micromamba-shell {0}
        env:
          WANDB_API_KEY: secrets.WANDB_API_KEY
          WANDB_MODE: offline                        # disables WandB server calls
        run: |
          pip list
          pytest --skip-gpu 
